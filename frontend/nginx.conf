# ── music.local — Music Hub (SvelteKit frontend) ─────────────────────────────
server {
    listen 80 default_server;
    server_name music.local music _;

    root /srv/music-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # All API and WebSocket traffic goes to the backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
}

# ── owntone.local — owntone web UI ───────────────────────────────────────────
server {
    listen 80;
    server_name owntone.local owntone;

    location / {
        proxy_pass         http://127.0.0.1:3689/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}

# ── jellyfin.local — Jellyfin ─────────────────────────────────────────────────
server {
    listen 80;
    server_name jellyfin.local jellyfin;

    location / {
        proxy_pass         http://127.0.0.1:8096/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }
}
