<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Light background -->
  <rect width="32" height="32" rx="8" fill="#F2F2F7"/>
  <!-- Silver CD body -->
  <circle cx="16" cy="16" r="13" fill="url(#silver)"/>
  <!-- Iridescent ring (cyan-blue) -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#5AC8FA" stroke-width="1.2" opacity="0.7"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#007AFF" stroke-width="0.7" opacity="0.5"/>
  <circle cx="16" cy="16" r="7"  fill="none" stroke="#5AC8FA" stroke-width="0.5" opacity="0.4"/>
  <!-- Inner hub -->
  <circle cx="16" cy="16" r="4.5" fill="#dce6f8"/>
  <!-- Spindle hole -->
  <circle cx="16" cy="16" r="2" fill="#0c0c18"/>
  <!-- Highlight -->
  <circle cx="16" cy="16" r="2" fill="none" stroke="#007AFF" stroke-width="0.6"/>
  <defs>
    <radialGradient id="silver" cx="36%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#f4f7ff"/>
      <stop offset="45%"  stop-color="#dce6f8"/>
      <stop offset="100%" stop-color="#adbce0"/>
    </radialGradient>
  </defs>
</svg>
