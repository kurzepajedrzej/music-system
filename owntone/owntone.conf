general {
    logfile = "/var/cache/owntone/owntone.log"
    loglevel = log
    uid = "owntone"
}

library {
    name = "Music Hub on %h"
    port = 3689

    # Directories owntone watches for music and pipe files
    directories = { "/srv/music" }

    # Don't auto-start pipes on owntone startup — pipes are started by systemd services
    pipe_autostart = false
}

